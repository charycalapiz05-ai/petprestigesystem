<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Pet Prestige</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-error { background:#fdecea; border:1px solid #f5c6cb; color:#c0392b; padding:10px 14px; border-radius:8px; font-size:0.88rem; margin-bottom:12px; display:none; }
        .auth-success { background:#d5f5e3; border:1px solid #a9dfbf; color:#1e8449; padding:10px 14px; border-radius:8px; font-size:0.88rem; margin-bottom:12px; display:none; }
        .forgot-link { float:right; font-size:0.82rem; color:var(--primary); cursor:pointer; text-decoration:none; }
        .forgot-link:hover { text-decoration:underline; }
        .auth-divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:#aaa; font-size:0.82rem; }
        .auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:#eee; }
        .btn-loading { opacity:0.7; pointer-events:none; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <a href="index.html" class="logo" style="display:flex;align-items:center;gap:10px;text-decoration:none;justify-content:center;margin-bottom:4px;">
                    <img src="images/logo-pet-prestige.png" alt="Pet Prestige" class="logo-img-main" style="height:70px;"
                         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback" style="display:none;align-items:center;gap:10px;">
                        <div class="logo-icon">🐾</div>
                        <div class="logo-text">
                            <span class="logo-main">Pet Prestige</span>
                            <span class="logo-tagline">Premium Pet Care</span>
                        </div>
                    </div>
                </a>
                <h1 id="authTitle">Welcome Back</h1>
                <p id="authSubtitle">Sign in to your account</p>
            </div>

            <div id="authError" class="auth-error"></div>
            <div id="authSuccess" class="auth-success"></div>

<!-- ── LOGIN FORM ── -->
        <form id="loginForm" class="auth-form" onsubmit="return false;">
            <div id="g_id_onload"
                 data-client_id="15660645091-b218lb3rmccpoiprc3ca42cjo214tpp0.apps.googleusercontent.com"
                 data-callback="handleGoogleLogin">
            </div>
            <div class="g_id_signin" data-type="standard" data-width="100%" data-text="signin_with" data-shape="rectangular" data-theme="outline"></div>
            <div class="auth-divider">or sign in with email</div>
            <div class="auth-divider">sign in with email</div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>
                    Password
                    <a class="forgot-link" onclick="showForgotPassword()">Forgot password?</a>
                </label>
                <div class="password-input">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <i class="fas fa-eye" onclick="togglePassword('loginPassword')"></i>
                </div>
            </div>
            <button type="button" class="btn btn-primary btn-block" id="loginBtn" onclick="handleLogin()">
                Sign In
            </button>
            <p class="auth-switch">Don't have an account? <a href="#" onclick="showRegister()">Create one</a></p>
        </form>

            <!-- ── REGISTER FORM ── -->
            <form id="registerForm" class="auth-form" style="display:none;" onsubmit="return false;">
                <div class="auth-divider">register with email</div>
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="regFirstName" placeholder="Juan" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="regLastName" placeholder="dela Cruz" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone (optional)</label>
                    <input type="tel" id="regPhone" placeholder="+63 912 345 6789">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-input">
                        <input type="password" id="regPassword" placeholder="At least 6 characters" required>
                        <i class="fas fa-eye" onclick="togglePassword('regPassword')"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-input">
                        <input type="password" id="regConfirm" placeholder="••••••••" required>
                        <i class="fas fa-eye" onclick="togglePassword('regConfirm')"></i>
                    </div>
                </div>
                <button type="button" class="btn btn-primary btn-block" id="registerBtn" onclick="handleRegister()">
                    Create Account
                </button>
                <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin()">Sign in</a></p>
            </form>

            <!-- ── FORGOT PASSWORD FORM ── -->
            <form id="forgotForm" class="auth-form" style="display:none;" onsubmit="return false;">
                <p style="color:#666;font-size:0.9rem;margin-bottom:16px;">
                    Enter your email and we'll help you reset your password.
                </p>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="you@example.com" required>
                </div>
                <button type="button" class="btn btn-primary btn-block" onclick="handleForgotPassword()">
                    Send Reset Instructions
                </button>
                <p class="auth-switch"><a href="#" onclick="showLogin()">← Back to Sign In</a></p>
            </form>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/api.js"></script>
<script src="js/script.js"></script>
<script src="js/api-bridge.js"></script> <script> async function handleGoogleLogin(response) {
    try {
        const res = await fetch('/api/oauth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Google login failed');

        API.setToken(data.accessToken);
        localStorage.setItem('petPrestigeUser', JSON.stringify(data.user));

        showSuccess('Google login successful! Redirecting...');
        setTimeout(() => {
            window.location.href = data.user.is_admin ? 'admin/dashboard.html' : 'index.html';
        }, 800);
    } catch (err) {
        showError(err.message || 'Google login failed. Please try again.');
    }
}async function handleGoogleLogin(response) {
    try {
        const res = await fetch('/api/oauth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Google login failed');

        API.setToken(data.accessToken);
        localStorage.setItem('petPrestigeUser', JSON.stringify(data.user));

        showSuccess('Google login successful! Redirecting...');
        setTimeout(() => {
            window.location.href = data.user.is_admin ? 'admin/dashboard.html' : 'index.html';
        }, 800);
    } catch (err) {
        showError(err.message || 'Google login failed. Please try again.');
    }
}
        function showError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('authSuccess').style.display = 'none';
        }
        function showSuccess(msg) {
            const el = document.getElementById('authSuccess');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('authError').style.display = 'none';
        }
        function clearMessages() {
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authSuccess').style.display = 'none';
        }

        function showLogin() {
            clearMessages();
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('authTitle').textContent = 'Welcome Back';
            document.getElementById('authSubtitle').textContent = 'Sign in to your account';
        }
        function showRegister() {
            clearMessages();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('authTitle').textContent = 'Create Account';
            document.getElementById('authSubtitle').textContent = 'Join the Pet Prestige family 🐾';
        }
        function showForgotPassword() {
            clearMessages();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'block';
            document.getElementById('authTitle').textContent = 'Reset Password';
            document.getElementById('authSubtitle').textContent = 'We\'ll help you get back in';
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // ── LOGIN ──────────────────────────────────────────────
        async function handleLogin() {
            clearMessages();
            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) return showError('Please enter your email and password.');

            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Signing in...';
            btn.classList.add('btn-loading');

            try {
                const data = await API.auth.login(email, password);
                showSuccess('Login successful! Redirecting...');

                // Redirect admin vs regular user
                setTimeout(() => {
                    if (data.user.is_admin) {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        const redirect = localStorage.getItem('petPrestigeLoginRedirect');
                        localStorage.removeItem('petPrestigeLoginRedirect');
                        window.location.href = redirect || 'index.html';
                    }
                }, 800);
            } catch (err) {
                showError(err.message || 'Login failed. Please try again.');
                btn.textContent = 'Sign In';
                btn.classList.remove('btn-loading');
            }
        }

        // ── REGISTER ───────────────────────────────────────────
        async function handleRegister() {
            clearMessages();
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName  = document.getElementById('regLastName').value.trim();
            const email     = document.getElementById('regEmail').value.trim();
            const phone     = document.getElementById('regPhone').value.trim();
            const password  = document.getElementById('regPassword').value;
            const confirm   = document.getElementById('regConfirm').value;

            if (!firstName || !lastName || !email || !password) return showError('Please fill in all required fields.');
            if (password.length < 6) return showError('Password must be at least 6 characters.');
            if (password !== confirm) return showError('Passwords do not match.');

            const btn = document.getElementById('registerBtn');
            btn.textContent = 'Creating account...';
            btn.classList.add('btn-loading');

            try {
                await API.auth.register(firstName + ' ' + lastName, email, password, phone);
                showSuccess('Account created! Welcome to Pet Prestige 🐾');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } catch (err) {
                showError(err.message || 'Registration failed. Please try again.');
                btn.textContent = 'Create Account';
                btn.classList.remove('btn-loading');
            }
        }

        // ── FORGOT PASSWORD ────────────────────────────────────
        function handleForgotPassword() {
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) return showError('Please enter your email address.');
            // For now, show a message — password reset email requires email service setup
            showSuccess('If an account exists for ' + email + ', reset instructions have been sent. Please contact hello@petprestige.ph if you need further help.');
        }

        // ── INIT ───────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            if (window.location.hash === '#register') showRegister();

            // Handle logout
            if (window.location.search.includes('logout=1')) {
                API.clearToken();
                history.replaceState(null, '', 'login.html');
                return;
            }

            // If already logged in, redirect
            if (API.auth.isLoggedIn()) {
                const user = API.auth.getUser();
                window.location.href = (user && user.is_admin) ? 'admin/dashboard.html' : 'index.html';
            }
        });

        // Allow Enter key to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').style.display !== 'none') handleLogin();
                else if (document.getElementById('registerForm').style.display !== 'none') handleRegister();
            }
        });
    </script>
</body>
</html>
