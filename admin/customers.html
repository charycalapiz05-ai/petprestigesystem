<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Pet Prestige Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body" data-admin-page="true">
<script src="../js/admin-guard.js"></script>
<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-logo" style="padding:20px 16px;">
            <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                <img src="../images/logo-pet-prestige.png" alt="Pet Prestige" style="height:44px;"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                <div style="display:none;align-items:center;gap:8px;">
                    <span style="font-size:1.6rem;">🐾</span>
                    <div>
                        <div style="color:white;font-weight:700;font-size:1rem;line-height:1.1;">Pet Prestige</div>
                        <div style="color:rgba(255,255,255,0.7);font-size:0.72rem;">Admin Panel</div>
                    </div>
                </div>
            </a>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="products.html"><i class="fas fa-box"></i> Products</a>
            <a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a>
            <a href="customers.html" class="active"><i class="fas fa-users"></i> Customers</a>
            <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
            <a href="lost-found-admin.html"><i class="fas fa-paw"></i> Lost & Found</a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        </nav>

        <div class="admin-sidebar-bottom">
            <a href="../index.html" target="_blank"><i class="fas fa-store"></i> View Store</a>
            <a href="#" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <h1>Customers</h1>
            <div class="admin-actions">
                <input type="text" id="customerSearch" placeholder="Search by name or email..." oninput="renderCustomers()">
                <button class="btn btn-outline" onclick="exportCustomers()">
                    <i class="fas fa-download"></i> Export CSV
                </button>
            </div>
        </header>

        <div class="admin-content">
            <div class="admin-card">
                <div class="card-header">
                    <h3>All Customers (<span id="customerCount">0</span>)</h3>
                </div>

                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Orders</th>
                                <th>Total Spent</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customersTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Customer Detail Modal -->
    <div class="modal" id="customerDetailModal" style="display:none;">
        <div class="modal-content" style="max-width:700px;">
            <button class="modal-close" onclick="closeCustomerModal()">×</button>
            <h2>Customer Details</h2>
            <div id="customerDetailContent"></div>
        </div>
    </div>
</div>

<script src="../js/admin-common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/script.js"></script>
<script src="../js/api-bridge.js"></script><script>
// Helper: Get unique customers from orders
function getCustomers() {
    const orders = JSON.parse(localStorage.getItem('petPrestigeOrders') || '[]');
    const customerMap = {};

    orders.forEach(order => {
        const email = order.shippingInfo?.email?.toLowerCase();
        const name = `${order.shippingInfo?.firstName || ''} ${order.shippingInfo?.lastName || ''}`.trim() || 'Guest';
        const phone = order.shippingInfo?.phone || '-';

        if (!email) return;

        if (!customerMap[email]) {
            customerMap[email] = {
                name,
                email,
                phone,
                orders: 0,
                totalSpent: 0,
                orderIds: []
            };
        }

        customerMap[email].orders++;
        customerMap[email].totalSpent += order.total || 0;
        customerMap[email].orderIds.push(order.id);
    });

    return Object.values(customerMap);
}

function renderCustomers() {
    const customers = getCustomers();
    const search = document.getElementById('customerSearch')?.value?.toLowerCase() || '';
    const table = document.getElementById('customersTable');
    const countEl = document.getElementById('customerCount');

    let filtered = customers.filter(c => 
        c.name.toLowerCase().includes(search) || 
        c.email.toLowerCase().includes(search)
    );

    countEl.textContent = filtered.length;

    table.innerHTML = filtered.length ? filtered.map((c, index) => `
        <tr>
            <td>${index + 1}</td>
            <td><strong>${c.name}</strong></td>
            <td>${c.email}</td>
            <td>${c.phone}</td>
            <td><span class="status-badge processing">${c.orders}</span></td>
            <td style="font-weight:700; color:var(--primary);">₱${c.totalSpent.toLocaleString()}</td>
            <td>
                <button class="btn btn-sm btn-primary" onclick="viewCustomer('${c.email}')">View</button>
            </td>
        </tr>
    `).join('') : '<tr><td colspan="7" style="text-align:center;padding:40px;color:#aaa;">No customers found.</td></tr>';
}

function viewCustomer(email) {
    const customers = getCustomers();
    const customer = customers.find(c => c.email.toLowerCase() === email.toLowerCase());
    if (!customer) return;

    const orders = JSON.parse(localStorage.getItem('petPrestigeOrders') || '[]');
    const customerOrders = orders.filter(o => o.shippingInfo?.email?.toLowerCase() === email.toLowerCase());

    const content = document.getElementById('customerDetailContent');
    content.innerHTML = `
        <div style="margin-bottom:20px;">
            <strong>Name:</strong> ${customer.name}<br>
            <strong>Email:</strong> ${customer.email}<br>
            <strong>Phone:</strong> ${customer.phone}<br>
            <strong>Total Orders:</strong> ${customer.orders}<br>
            <strong>Total Spent:</strong> ₱${customer.totalSpent.toLocaleString()}
        </div>

        <h4>Order History</h4>
        <table class="admin-table" style="width:100%;">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                ${customerOrders.map(o => `
                    <tr>
                        <td>${o.id}</td>
                        <td>${new Date(o.date).toLocaleDateString()}</td>
                        <td>₱${(o.total || 0).toLocaleString()}</td>
                        <td><span class="status-badge ${o.status}">${o.status}</span></td>
                    </tr>
                `).join('') || '<tr><td colspan="4">No orders found</td></tr>'}
            </tbody>
        </table>
    `;

    document.getElementById('customerDetailModal').style.display = 'flex';
}

function closeCustomerModal() {
    document.getElementById('customerDetailModal').style.display = 'none';
}

function exportCustomers() {
    const customers = getCustomers();
    if (!customers.length) return alert('No customers to export');

    const headers = ['Name', 'Email', 'Phone', 'Orders', 'Total Spent'];
    const rows = customers.map(c => [
        c.name,
        c.email,
        c.phone,
        c.orders,
        c.totalSpent
    ]);

    const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'petprestige_customers.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Customers exported as CSV');
}

function showToast(msg) {
    alert(msg); // Replace with your real toast UI if you have one
}

document.addEventListener('DOMContentLoaded', function() {
    renderCustomers();
});

function logoutAdmin() {
    if (confirm('Logout from admin panel?')) {
        localStorage.removeItem('petPrestigeAdminSession');
        localStorage.removeItem('petPrestigeUser');
        window.location.href = '../login.html?logout=1';
    }
}
</script>
</body>
</html>
